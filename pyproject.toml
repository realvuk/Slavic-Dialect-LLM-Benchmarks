[project]
name = "slavic-dialect-llm-benchmarks"
version = "0.1.0"
description = "Zero-shot LLM benchmarks on Slavic-dialect commonsense (CLASSLA-PIQA) and causal reasoning (DIALECT-COPA) via OpenRouter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[tool.ruff]
line-length = 100
target-version = "py310"
